# 片語清單：句子裡出現這些片語時，在句子下方的「片語」區顯示意思，翻譯時也會提示翻譯模型。
#
# 收錄範圍參考（只參考「收哪些片語」，意思和說明都自己寫，不照抄）：
#   《高中贏家 升大學英文應考好幫手：片語篇》動詞片語部分
#   PREPEDU〈英文片語大全〉https://prepedu.com/zh-hant/blog/phrases-in-english（不收粗俗用語）
#
# 欄位：
#   id       代號（英文小寫加底線，不可重複）
#   phrase   顯示的樣子（字典形式）
#   kind     動詞片語／形容詞片語／介系詞片語／副詞片語／慣用語
#   meaning  意思（多個意思用「；」隔開）
#   literal  （慣用語才有）字面上的意思，讓學生知道不能照字面翻
#   note     （選填）補充，例如可以拆開、容易誤會的地方
#   找法（二選一）：
#     head＋parts：用文法分析找「head 這個字」和「掛在它後面的 parts」，中間可以夾受詞
#                  （give it up、turn the light off 也找得到）；head 用原形
#     seq：照順序連在一起的字；動詞會自動比對各種變化（rains、rained、raining）
#          (字)＝可有可無；[someone]／[something]＝中間夾 1～6 個字；[one's]＝my／your／his／Tom's…
#
# 加新片語後，執行 .venv/bin/python tests/phrases_test.py 確認沒有找錯。

