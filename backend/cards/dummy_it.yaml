id: dummy_it
title: 虛主詞 It
brief: It 只是佔位子，真正的主詞在句子後面。
trigger: It ＋ be ＋ 形容詞 ＋ to V／that 子句
blocks:
- type: formula
  text: It ＋ be ＋ 形容詞 ＋ to V …
- type: heading
  text: 還原測試
- type: examples
  examples:
  - en: <b>It</b> is hard <b>to learn English</b>.
    zh: 常見說法
    mark: none
  - en: <b>To learn English</b> is hard.
    zh: 還原後：S + V + SC
    mark: none
- type: tip
  text: 主詞太長時，英文習慣先用 It 佔位，把長的主詞放到句尾，讀起來比較輕鬆。
- type: info
  text: 和 There is 的差別：There is 的 There 是引導詞，真正的主詞標 S；It 句型的 It 標 S，真正的主詞標「真主詞」。
- type: warn
  text: 很多人看到後面的 to learn，就以為是 S + V + O。
  examples:
  - en: It is hard to learn English.
    zh: 句型二（S + V + SC），hard 才是補語
    mark: none
see_also:
- there_be
