<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文句子骨架分析</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header class="top">
      <h1>英文句子骨架分析</h1>
      <p class="hint">輸入英文句子或一段文章，看看每一句的主詞、動詞、受詞，以及屬於哪一種句型。</p>
      <p class="top-links">
        <a href="/patterns" target="_blank" rel="noopener">五大句型是什麼？</a>
        <a href="/quiz">句型小遊戲</a>
        <a href="/about">關於這個工具</a>
        <button type="button" id="share-site" class="link-btn">分享給朋友</button>
      </p>
    </header>

    <form id="form" class="ask" novalidate>
      <label for="input" class="sr-only">英文句子</label>
      <textarea id="input" rows="3" maxlength="2000" placeholder="The teacher showed us a picture." autocomplete="off" spellcheck="false"></textarea>
      <div class="ask-bar">
        <span id="counter" class="counter">0 / 2000</span>
        <button id="submit" type="submit" class="primary">分析</button>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </form>
    <!-- 最近分析：平常收合成一行，要用時再展開，免得句子一多就擠滿畫面 -->
    <details id="history" class="history" hidden>
      <summary>🕘 最近分析<span id="history-count" class="history-count"></span></summary>
      <div class="history-panel">
        <ol id="history-list" class="history-list"></ol>
        <button type="button" id="history-clear" class="link-btn history-clear">清除紀錄</button>
      </div>
    </details>

    <section id="toolbar" class="toolbar" hidden>
      <div class="modes" role="group" aria-label="顯示模式">
        <button type="button" data-mode="skeleton" aria-pressed="true">骨架模式</button>
        <button type="button" data-mode="detail" aria-pressed="false">詳細模式</button>
      </div>
    </section>

    <p id="toast" class="toast" role="status" hidden></p>
    <section id="result" aria-live="polite"></section>
    <!-- 分享、列印是「看完分析之後」要做的事，放在結果下方，和上方切換顯示方式的按鈕分開 -->
    <div id="result-actions" class="result-actions" hidden>
      <span class="ra-hint">看完了嗎？</span>
      <button type="button" id="share-result">🔗 分享這個分析</button>
      <button type="button" id="print">🖨️ 列印講義</button>
    </div>

    <footer class="foot">
      <p>分析結果由程式自動產生，僅供學習參考，可能會有錯誤。發現錯誤時，請按句子旁的「回報錯誤」。</p>
      <details class="suggest">
        <summary>提供建議</summary>
        <form id="suggest-form" class="feedback">
          <label for="suggest-text" class="sr-only">你的建議</label>
          <textarea id="suggest-text" rows="3" maxlength="1000" placeholder="希望增加什麼功能？哪裡不好用？"></textarea>
          <p class="fb-note">請不要填寫姓名、電話等個人資料。</p>
          <button type="submit" class="primary">送出</button>
          <p id="suggest-status" class="fb-status" role="status"></p>
        </form>
      </details>
    </footer>
  </main>
  <script src="/static/speech.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/translate.js"></script>
</body>
</html>
